name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 11 is the toolchain the rules are compiled with, Gradle itself runs on 17
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6
      - name: Check (tests on both engines, spotless, coverage gate)
        run: ./gradlew check
      - name: detekt CLI smoke test
        run: ./scripts/cli-smoke-test.sh
      - name: Upload Gradle Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/
          if-no-files-found: warn
